name: OMNIS CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile-check all Python packages
        run: python -m compileall -q core sonapse mnemorph neurohive morpheus diamond ghost_engine supermix_aether genesis hardware cognition benchmarks observatory frontier tests

      - name: Verify Frontier Registry & Neutral Hook Contract
        run: |
          python -c "from frontier import build_frontier_registry, FrontierExtensionHook; reg = build_frontier_registry(); assert len(reg) >= 18; hook = FrontierExtensionHook(); assert hook.on_step({'tick': 1}) is None; print('Frontier registry verified:', len(reg), 'modules')"

      - name: Run full pytest verification suite
        run: pytest -v
